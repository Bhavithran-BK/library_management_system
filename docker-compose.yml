version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: library-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: library_db
    volumes:
      - mongo-data:/data/db

  # Redis instance for Member 2/4 integration
  redis:
    image: redis:7.2-alpine
    container_name: library-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
