# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/

# MongoDB Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/library_db}
spring.data.mongodb.database=${MONGODB_DATABASE:library_db}
spring.data.mongodb.auto-index-creation=true

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:9a82f41c6b5d3e7102948c5b3a1d9e2f476a8b0c1d2e3f4a5b6c7d8e9f012345}
app.jwt.expiration-ms=86400000

# Library Business Rules Configuration
app.library.fine.per-day-rate=5.0
app.library.loan.default-duration-days=14

# Unique ID Generator (Snowflake-based distributed strategy)
app.id-generator.worker-id=${WORKER_ID:1}
app.id-generator.datacenter-id=${DATACENTER_ID:1}
app.id-generator.strategy=snowflake

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.library=INFO
logging.level.org.springframework.data.mongodb=INFO

# Redis Configuration (Member 2 Cache-Aside & Member 4 Rate Limiting / Shortlinks)
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Cache Configuration
app.cache.enabled=${CACHE_ENABLED:true}
app.cache.ttl-seconds=${CACHE_TTL_SECONDS:300}

# Controlled Crawler Configuration (Member 2)
app.crawler.enabled=${CRAWLER_ENABLED:true}
app.crawler.max-pages=${CRAWLER_MAX_PAGES:20}
app.crawler.max-depth=${CRAWLER_MAX_DEPTH:2}
app.crawler.timeout-ms=${CRAWLER_TIMEOUT_MS:3000}
app.crawler.allowed-domains=${CRAWLER_ALLOWED_DOMAINS:localhost,127.0.0.1}

# Distributed Storage & Consistent Hashing Configuration (Member 3)
app.distribution.virtual-nodes=${DISTRIBUTION_VIRTUAL_NODES:150}
app.distribution.initial-nodes=${DISTRIBUTION_INITIAL_NODES:storage-node-1,storage-node-2,storage-node-3,storage-node-4}

# Member 4: Token Bucket Rate Limiter
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
app.rate-limit.refill-rate-per-sec=${RATE_LIMIT_REFILL_RATE:10}
app.rate-limit.protected-paths=/api/books/**,/api/loans/**,/api/search/**,/api/short-links/**

# Member 4: URL Shortener Configuration
app.short-link.cache-ttl-hours=${SHORT_LINK_CACHE_TTL_HOURS:24}
app.short-link.base-url=${SHORT_LINK_BASE_URL:http://localhost:8081}
